{% extends "base.html" %}

{% block title %}Sign in · {{ event_name }}{% endblock %}

{% block content %}
  <section class="login">
    <h1 class="display">{{ event_name }}</h1>
    <p class="lede">Staff sign in</p>

    {% if error %}
      <p class="alert" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="stack">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <label>
        Username
        <input name="username" value="{{ username or '' }}" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="button">Sign in</button>
    </form>

    <p class="hint">No public registration. Accounts are issued by the event admin.</p>
  </section>
{% endblock %}
