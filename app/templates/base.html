<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}{{ event_name }}{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% if user %}
      <header class="topbar">
        <a class="brand" href="/" aria-label="{{ event_name }} home">{{ event_name }}</a>
        <nav class="nav" aria-label="Main">
          {% if user.role.value == "admin" %}
            <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7" />
              </svg>
              <span>Dashboard</span>
            </a>
          {% endif %}
          <a href="/tickets" {% if request.url.path.startswith("/tickets") %}aria-current="page"{% endif %}>
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6V5Z" />
              <path d="M13 8v1m0 3v1m0 3v1" />
            </svg>
            <span>Tickets</span>
          </a>
          <a href="/scan" {% if request.url.path == "/scan" %}aria-current="page"{% endif %}>
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3m0 8v3a1 1 0 0 1-1 1h-3m-8 0H5a1 1 0 0 1-1-1v-3" />
              <path d="M8 8h3v3H8zm6 0h2m-2 3h2m-8 3h2v2H8zm5 0h3v3h-3z" />
            </svg>
            <span>Scan</span>
          </a>
          {% if user.role.value == "admin" %}
            <a href="/admin/users" {% if request.url.path.startswith("/admin/users") %}aria-current="page"{% endif %}>
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="9" cy="8" r="3" />
                <path d="M3.5 20v-1a5.5 5.5 0 0 1 11 0v1zm12.5-9a3 3 0 1 0 0-6m1 9a5 5 0 0 1 3.5 4.8v1" />
              </svg>
              <span>Staff</span>
            </a>
          {% endif %}
        </nav>
        <form method="post" action="/logout" class="signout">
          <button type="submit" class="link-button">Sign out</button>
        </form>
      </header>
    {% endif %}

    {% if flash %}
      <p class="flash" role="status">{{ flash }}</p>
    {% endif %}

    <main class="page" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
